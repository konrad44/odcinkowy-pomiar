name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testy i budowanie
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Zmiana nazwy APK
        run: cp app/build/outputs/apk/release/app-release.apk odcinkowy-pomiar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: odcinkowy-pomiar-apk
          path: odcinkowy-pomiar.apk

      # Na gałęzi master APK ląduje też w wydaniu "latest" – do pobrania z telefonu bez logowania.
      - name: Wydanie latest
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Odcinkowy Pomiar Prędkości – najnowsza wersja
          files: odcinkowy-pomiar.apk
          make_latest: true
